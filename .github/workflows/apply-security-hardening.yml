name: Security hardening CI

on:
  push:
    branches:
      - audit/security-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotent hardening migrations
        run: npm run harden

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Validate whitespace
        run: git diff --check

      - name: Start hardened application
        env:
          PORT: 3000
          NODE_ENV: test
          SESSION_SECRET: ci-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          ADMIN_DEFAULT_PASS: ci-only-admin-password-2026
          ADMIN_PATH: ci-admin-panel
          DATA_DIR: /tmp/nad-ci-data
        run: |
          rm -rf /tmp/nad-ci-data
          node -r ./security-bootstrap.js server.js > /tmp/nad-server.log 2>&1 &
          echo $! > /tmp/nad-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nad-server.log
          exit 1

      - name: Smoke test public and SEO endpoints
        run: |
          curl --fail --silent http://127.0.0.1:3000/health | grep '"status":"ok"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/proyectos)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/proyecto/1)" = "200"
          curl --fail --silent http://127.0.0.1:3000/proyecto/1 | grep -F '<h1>Edificio Comercial</h1>'
          curl --fail --silent http://127.0.0.1:3000/proyecto/1 | grep -F '<link rel="canonical" href="http://127.0.0.1:3000/proyecto/1">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/proyecto/99999999)" = "404"

      - name: Verify internal files are not public
        run: |
          for path in /security-bootstrap.js /project.html /lib/security-config.js /lib/sqlite-session-store.js /scripts/patch-server-security-v2.js /.github/workflows/apply-security-hardening.yml; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000${path}")"
            test "$code" = "404"
          done

      - name: Verify session auth and CSRF defenses
        run: |
          ORIGIN='http://127.0.0.1:3000'
          LOGIN='http://127.0.0.1:3000/ci-admin-panel/login'
          API='http://127.0.0.1:3000/ci-admin-panel/api'

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -d 'username=admin&password=ci-only-admin-password-2026' "$LOGIN")" = "403"

          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -c /tmp/nad-cookie -H "Origin: $ORIGIN" -X POST -d 'username=admin&password=ci-only-admin-password-2026' "$LOGIN")"
          test "$code" = "302"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/nad-cookie http://127.0.0.1:3000/ci-admin-panel)" = "200"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/nad-cookie -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -X POST -d '{"url":"/uploads/nope.jpg"}' "$API/delete-asset")" = "403"

          printf 'this is not a jpeg' > /tmp/fake.jpg
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/nad-cookie -H "Origin: $ORIGIN" -X POST -F 'asset=@/tmp/fake.jpg;type=image/jpeg' "$API/upload-asset")" = "400"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/nad-cookie -H "Origin: $ORIGIN" -X POST http://127.0.0.1:3000/ci-admin-panel/logout)" = "204"

      - name: Verify security headers
        run: |
          headers="$(curl --silent --dump-header - --output /dev/null http://127.0.0.1:3000/)"
          echo "$headers" | grep -i '^Content-Security-Policy:'
          echo "$headers" | grep -i '^X-Content-Type-Options: nosniff'
          echo "$headers" | grep -i '^X-Frame-Options:'

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/nad-server.pid ]; then
            kill "$(cat /tmp/nad-server.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/nad-server.log ]; then
            cat /tmp/nad-server.log
          fi

      - name: Persist hardened source on audit branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/audit/security-hardening'
        run: |
          git add server.js script.js admin/index.html
          if git diff --cached --quiet; then
            echo 'Hardened source already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: persist validated hardening changes'
          git push origin HEAD:audit/security-hardening
