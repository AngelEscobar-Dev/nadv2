name: One-time admin rendering fix

on:
  push:
    branches:
      - audit/security-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/security-hardening

      - name: Escape dynamic values rendered in admin HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin/index.html')
          text = path.read_text(encoding='utf-8')

          helper = """function escapeAdminHtml(value){
          return String(value == null ? '' : value).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));
          }
          function safeAdminMediaUrl(value){
          try{const u=new URL(String(value||''),window.location.origin);if(u.protocol!=='http:'&&u.protocol!=='https:')return '/nad.png';return escapeAdminHtml(u.href);}catch(e){return '/nad.png';}
          }
          """

          if 'function escapeAdminHtml(value)' not in text:
              marker = 'function renderTables(){'
              if marker not in text:
                  raise SystemExit('renderTables marker not found')
              text = text.replace(marker, helper + marker, 1)

          lines = text.splitlines()
          replaced_table = False
          for i, line in enumerate(lines):
              if line.startswith('const cr=(p,f=false)=>'):
                  lines[i] = "const cr=(p,f=false)=>`<tr><td><img src=\"${safeAdminMediaUrl(p.image)}\" alt=\"${escapeAdminHtml(p.title)}\" onerror=\"this.src='/nad.png'\"></td><td><strong>${escapeAdminHtml(p.title)}</strong></td>${f?`<td>${escapeAdminHtml(p.category)}</td>`:''}<td><span class=\"bf ${p.featured?'if':'nf'}\" onclick=\"toggleFeatured(${p.id})\">${p.featured?'Destacado':'Más proyectos'}</span></td><td><span class=\"by\">${p.year}</span></td><td><span class=\"bv ${p.visible?'on':'off'}\" onclick=\"toggleVisible(${p.id})\">${p.visible?'Visible':'Oculto'}</span></td><td><div class=\"acts\"><button class=\"bi be\" title=\"Editar\" onclick=\"openEditModal(${p.id})\">${editIcon}</button><button class=\"bi bd\" title=\"Eliminar\" onclick=\"deleteProject(${p.id})\">${trashIcon}</button></div></td></tr>`;"
                  replaced_table = True
                  break
          if not replaced_table and 'safeAdminMediaUrl(p.image)' not in text:
              raise SystemExit('project row renderer not found')

          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          text = text.replace('src=\"${previewSrc}\"', 'src=\"${escapeAdminHtml(previewSrc)}\"')
          text = text.replace('src=\"${url}\"', 'src=\"${escapeAdminHtml(url)}\"')

          path.write_text(text, encoding='utf-8')
          PY

          grep -F 'safeAdminMediaUrl(p.image)' admin/index.html
          grep -F 'escapeAdminHtml(p.title)' admin/index.html
          grep -F 'escapeAdminHtml(previewSrc)' admin/index.html

      - name: Commit the one-time fix
        run: |
          if git diff --quiet -- admin/index.html; then
            echo 'Admin rendering is already hardened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git commit -m 'security: escape dynamic values in admin rendering'
          git push origin HEAD:audit/security-hardening
